<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Memory Match Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 20px; z-index: 10; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #0F172A; }
        #scoreBoard { color: #8B5CF6; border-left: 4px solid #8B5CF6; }
        #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 400px; aspect-ratio: 1; z-index: 5; }
        .card { perspective: 1000px; aspect-ratio: 1; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
        .card-front { background: #FFFFFF; border: 2px solid #E2E8F0; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); color: #8B5CF6; font-weight: 800; }
        .card-back { background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); transform: rotateY(180deg); color: #FFFFFF; box-shadow: 0 6px 16px rgba(139, 92, 246, 0.3); }
        .card.matched .card-back { background: linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3); }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); color: #10B981; margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🎯 MATCHES: <span id="score">0/8</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Perfect Match!</h2>
            <p>Completed in: <span><span id="finalScore">0</span> turns</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="grid"></div>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const emojis = ['⚡', '⭐', '❤️', '🍀', '☀️', '❄️', '🌙', '🌸'];
        let cards = [];
        let flippedCards = [];
        let matches = 0;
        let turns = 0;
        let canFlip = true;

        function playFlipSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playMatchSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + (idx * 0.06);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.15);
                });
            } catch(e) {}
        }

        function playMismatchSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.16);
            } catch(e) {}
        }

        function initGame() {
            gridEl.innerHTML = '';
            cards = [...emojis, ...emojis];
            cards.sort(() => Math.random() - 0.5);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">${emoji}</div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                gridEl.appendChild(card);
            });
            matches = 0;
            turns = 0;
            flippedCards = [];
            canFlip = true;
            scoreEl.innerText = `0/8`;
        }

        function flipCard(card) {
            if (!userId || !canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playFlipSound();
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                turns++;
                canFlip = false;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                scoreEl.innerText = `${matches}/8`;
                playMatchSound();
                flippedCards = [];
                canFlip = true;

                if (matches === 8) {
                    setTimeout(triggerGameOver, 600);
                }
            } else {
                playMismatchSound();
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 800);
            }
        }

        function triggerGameOver() {
            finalScoreEl.innerText = turns;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            const rewardCoins = Math.max(10, 80 - turns);

            fetch('/api/games/submit-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Memory Match' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                    if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Memory Match' }, '*'); }
                } else {
                    syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                }
                restartBtn.style.display = "block";
            })
            .catch(err => {
                syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                restartBtn.style.display = "block";
            });
        }

        function resetGame() {
            gameOverScreen.style.display = 'none';
            initGame();
        }

        if (userId) {
            initGame();
        }
    </script>
</body>
</html>
