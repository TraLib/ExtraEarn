<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Memory Match</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 20px; z-index: 10; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 14px 20px; border-radius: 16px; font-weight: 700; font-size: 1rem; letter-spacing: 0.05em; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #38bdf8; border-bottom: 2px solid rgba(56, 189, 248, 0.4); }
        #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 400px; aspect-ratio: 1; z-index: 5; }
        .card { perspective: 1000px; aspect-ratio: 1; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .card-front { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .card-back { background: linear-gradient(135deg, #3b82f6, #1d4ed8); transform: rotateY(180deg); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .card.matched .card-back { background: linear-gradient(135deg, #10b981, #065f46); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: 2.5rem; color: #10b981; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
        #gameOverScreen p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #fbbf24; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; }
        button { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button:hover { background: #0ea5e9; transform: translateY(-3px); }
        #authScreen h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🎯 MATCHES: <span id="score">0/8</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Perfect Match!</h2>
            <p>Completed in: <span><span id="finalScore">0</span> turns</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="grid"></div>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const emojis = ['⚡', '⭐', '❤️', '🍀', '☀️', '❄️', '🌙', '🌸'];
        let cards = [];
        let flippedCards = [];
        let matches = 0;
        let turns = 0;
        let canFlip = true;

        function initGame() {
            gridEl.innerHTML = '';
            cards = [...emojis, ...emojis];
            // Shuffle
            cards.sort(() => Math.random() - 0.5);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">${emoji}</div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                gridEl.appendChild(card);
            });
            matches = 0;
            turns = 0;
            flippedCards = [];
            canFlip = true;
            scoreEl.innerText = `0/8`;
        }

        function flipCard(card) {
            if (!userId || !canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                turns++;
                canFlip = false;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                scoreEl.innerText = `${matches}/8`;
                flippedCards = [];
                canFlip = true;

                if (matches === 8) {
                    setTimeout(triggerGameOver, 600);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function triggerGameOver() {
            finalScoreEl.innerText = turns;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            // Reward calculation: base score of 50 coins for completion, bonus if turns are low
            const rewardCoins = Math.max(10, 80 - turns);

            fetch('/api/games/submit-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Memory Match' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                } else {
                    syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                }
                restartBtn.style.display = "block";
            })
            .catch(err => {
                console.error("Score submission failed:", err);
                syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                restartBtn.style.display = "block";
            });
        }

        function resetGame() {
            gameOverScreen.style.display = 'none';
            initGame();
        }

        if (userId) {
            initGame();
        }
    </script>
</body>
</html>
