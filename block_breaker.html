<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Block Breaker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #uiOverlay { position: absolute; top: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #10b981; border-bottom: 2px solid rgba(16, 185, 129, 0.4); }
        #livesBoard { color: #f87171; border-bottom: 2px solid rgba(248, 113, 113, 0.4); }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: 2.5rem; color: #f87171; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 40px rgba(248, 113, 113, 0.6); }
        #gameOverScreen p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #fbbf24; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; }
        button { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button:hover { background: #0ea5e9; transform: translateY(-3px); }
        #authScreen h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🧱 SCORE: <span id="score">0</span></div>
            <div id="livesBoard" class="glass-card">❤️ LIVES: <span id="lives">3</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2 id="endTitle">Game Over</h2>
            <p>Bricks broken: <span><span id="finalScore">0</span> pts</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const endTitleEl = document.getElementById('endTitle');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let score = 0;
        let lives = 3;
        let gameOver = false;

        const paddle = {
            width: 100,
            height: 12,
            x: 0,
            y: 0,
            color: '#38bdf8'
        };

        const ball = {
            x: 0,
            y: 0,
            radius: 8,
            dx: 4,
            dy: -4,
            color: '#ffffff'
        };

        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 6;
        const brickHeight = 24;
        const brickPadding = 8;
        const brickOffsetTop = 100;
        const colors = ['#f87171', '#fbbf24', '#34d399', '#38bdf8', '#c084fc'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            paddle.y = canvas.height - 60;
            if (paddle.x === 0) paddle.x = canvas.width / 2 - paddle.width / 2;
            initBricks();
            resetBall();
        }

        window.addEventListener('resize', resizeCanvas);

        function initBricks() {
            bricks = [];
            const screenWidth = canvas.width;
            const totalPaddingWidth = brickPadding * (brickColumnCount + 1);
            const brickWidth = (screenWidth - totalPaddingWidth) / brickColumnCount;

            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    const brickX = c * (brickWidth + brickPadding) + brickPadding;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r] = { x: brickX, y: brickY, width: brickWidth, status: 1, color: colors[r] };
                }
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = paddle.y - ball.radius - 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
            ball.dy = -5;
        }

        // Drag controls
        window.addEventListener('pointermove', (e) => {
            if (!userId || gameOver) return;
            const relativeX = e.clientX;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x > canvas.width - paddle.width) paddle.x = canvas.width - paddle.width;
            }
        });

        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        if (ball.x > b.x && ball.x < b.x + b.width && ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 5;
                            scoreEl.innerText = score;
                        }
                    }
                }
            }
            if (activeBricks === 0 && !gameOver) {
                triggerGameOver(true);
            }
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = paddle.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ball.color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, b.width, brickHeight, 4);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function triggerGameOver(win = false) {
            gameOver = true;
            finalScoreEl.innerText = score;
            endTitleEl.innerText = win ? "victory!" : "game over";
            endTitleEl.style.color = win ? "#10b981" : "#f87171";
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            // Reward 1 coin per 5 points (maximum 50 coins)
            const rewardCoins = Math.min(50, Math.floor(score / 5));

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Block Breaker' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    console.error("Score submission failed:", err);
                    syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Break more blocks to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            gameOverScreen.style.display = 'none';
            initBricks();
            resetBall();
            animate();
        }

        function animate() {
            if (!userId || gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Wall collisions
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > paddle.y - ball.radius) {
                // Paddle check
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // Control bounce angle depending on where the ball hits the paddle
                    let relativeHit = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                    ball.dx = relativeHit * 6;
                    ball.dy = -Math.abs(ball.dy);
                } else if (ball.y + ball.dy > canvas.height) {
                    lives--;
                    livesEl.innerText = lives;
                    if (lives <= 0) {
                        triggerGameOver(false);
                        return;
                    } else {
                        resetBall();
                    }
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        if (userId) {
            animate();
        }
    </script>
</body>
</html>
