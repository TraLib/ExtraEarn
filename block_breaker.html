<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Block Breaker Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #uiOverlay { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #0F172A; }
        #scoreBoard { color: #10B981; border-left: 4px solid #10B981; }
        #livesBoard { color: #EF4444; border-left: 4px solid #EF4444; }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); color: #EF4444; margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🧱 SCORE: <span id="score">0</span></div>
            <div id="livesBoard" class="glass-card">❤️ LIVES: <span id="lives">3</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2 id="endTitle">Game Over</h2>
            <p>Bricks broken: <span><span id="finalScore">0</span> pts</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const endTitleEl = document.getElementById('endTitle');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let score = 0;
        let lives = 3;
        let gameOver = false;

        const paddle = {
            width: 110,
            height: 14,
            x: 0,
            y: 0,
            color: '#10B981'
        };

        const ball = {
            x: 0,
            y: 0,
            radius: 9,
            dx: 4,
            dy: -4,
            color: '#6366F1'
        };

        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 6;
        const brickHeight = 24;
        const brickPadding = 8;
        const brickOffsetTop = 90;
        const colors = ['#EF4444', '#F59E0B', '#10B981', '#06B6D4', '#8B5CF6'];

        function playBounceSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch(e) {}
        }

        function playSmashSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            paddle.y = canvas.height - 60;
            if (paddle.x === 0) paddle.x = canvas.width / 2 - paddle.width / 2;
            initBricks();
            resetBall();
        }

        window.addEventListener('resize', resizeCanvas);

        function initBricks() {
            bricks = [];
            const screenWidth = canvas.width;
            const totalPaddingWidth = brickPadding * (brickColumnCount + 1);
            const brickWidth = (screenWidth - totalPaddingWidth) / brickColumnCount;

            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    const brickX = c * (brickWidth + brickPadding) + brickPadding;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r] = { x: brickX, y: brickY, width: brickWidth, status: 1, color: colors[r] };
                }
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = paddle.y - ball.radius - 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
            ball.dy = -5;
        }

        window.addEventListener('pointermove', (e) => {
            if (!userId || gameOver) return;
            const relativeX = e.clientX;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x > canvas.width - paddle.width) paddle.x = canvas.width - paddle.width;
            }
        });

        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        if (ball.x > b.x && ball.x < b.x + b.width && ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 5;
                            scoreEl.innerText = score;
                            playSmashSound();
                        }
                    }
                }
            }
            if (activeBricks === 0 && !gameOver) {
                triggerGameOver(true);
            }
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(16, 185, 129, 0.3)';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, b.width, brickHeight, 6);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function triggerGameOver(win = false) {
            gameOver = true;
            finalScoreEl.innerText = score;
            endTitleEl.innerText = win ? "VICTORY!" : "GAME OVER";
            endTitleEl.style.color = win ? "#10B981" : "#EF4444";
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            const rewardCoins = Math.min(50, Math.floor(score / 5));

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Block Breaker' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                        if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Block Breaker' }, '*'); }
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Break more blocks to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            gameOverScreen.style.display = 'none';
            initBricks();
            resetBall();
            animate();
        }

        function animate() {
            if (!userId || gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#F4F7FC';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
                playBounceSound();
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
                playBounceSound();
            } else if (ball.y + ball.dy > paddle.y - ball.radius) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    let relativeHit = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                    ball.dx = relativeHit * 6;
                    ball.dy = -Math.abs(ball.dy);
                    playBounceSound();
                } else if (ball.y + ball.dy > canvas.height) {
                    lives--;
                    livesEl.innerText = lives;
                    if (lives <= 0) {
                        triggerGameOver(false);
                        return;
                    } else {
                        resetBall();
                    }
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        if (userId) {
            animate();
        }
    </script>
</body>
</html>
