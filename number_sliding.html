<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Number Slider</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 320px; margin-bottom: 20px; z-index: 10; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #38bdf8; border-bottom: 2px solid rgba(56, 189, 248, 0.4); }
        
        #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 320px; aspect-ratio: 1; background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 8px; z-index: 5; margin-bottom: 20px; }
        .cell { background: rgba(15, 23, 42, 0.6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; aspect-ratio: 1; transition: background 0.15s, transform 0.1s; }
        
        /* Grid color blocks */
        .val-2 { background: #1e293b; color: #94a3b8; }
        .val-4 { background: #334155; color: #cbd5e1; }
        .val-8 { background: #f97316; color: #fff; box-shadow: 0 0 10px rgba(249, 115, 22, 0.3); }
        .val-16 { background: #ea580c; color: #fff; box-shadow: 0 0 15px rgba(234, 88, 12, 0.4); }
        .val-32 { background: #ef4444; color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .val-64 { background: #dc2626; color: #fff; box-shadow: 0 0 20px rgba(220, 38, 38, 0.5); }
        .val-128 { background: #eab308; color: #fff; box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
        .val-256 { background: #ca8a04; color: #fff; box-shadow: 0 0 25px rgba(202, 138, 4, 0.6); }
        .val-512 { background: #10b981; color: #fff; box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
        .val-1024 { background: #069668; color: #fff; box-shadow: 0 0 30px rgba(6, 150, 104, 0.7); }
        .val-2048 { background: #8b5cf6; color: #fff; box-shadow: 0 0 35px rgba(139, 92, 246, 0.8); }

        #controls { display: grid; grid-template-areas: ". up ." "left down right"; gap: 10px; z-index: 5; margin-top: 10px; width: 100%; max-width: 200px; }
        .dir-btn { width: 60px; height: 50px; border-radius: 12px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; color: #fff; font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .dir-btn:active { background: rgba(56, 189, 248, 0.3); border-color: #38bdf8; }
        #btn-up { grid-area: up; }
        #btn-left { grid-area: left; }
        #btn-down { grid-area: down; }
        #btn-right { grid-area: right; }

        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: 2.5rem; color: #f87171; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
        #gameOverScreen p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #fbbf24; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; }
        button.action-btn { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button.action-btn:hover { background: #0ea5e9; transform: translateY(-3px); }
        #authScreen h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">⭐ SCORE: <span id="score">0</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>No Moves Left!</h2>
            <p>Score reached: <span><span id="finalScore">0</span> pts</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button class="action-btn" id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="grid">
            <div class="cell" id="c0"></div>
            <div class="cell" id="c1"></div>
            <div class="cell" id="c2"></div>
            <div class="cell" id="c3"></div>
            <div class="cell" id="c4"></div>
            <div class="cell" id="c5"></div>
            <div class="cell" id="c6"></div>
            <div class="cell" id="c7"></div>
            <div class="cell" id="c8"></div>
            <div class="cell" id="c9"></div>
            <div class="cell" id="c10"></div>
            <div class="cell" id="c11"></div>
            <div class="cell" id="c12"></div>
            <div class="cell" id="c13"></div>
            <div class="cell" id="c14"></div>
            <div class="cell" id="c15"></div>
        </div>

        <div id="controls">
            <button class="dir-btn" id="btn-up" onclick="slide('up')">▲</button>
            <button class="dir-btn" id="btn-left" onclick="slide('left')">◀</button>
            <button class="dir-btn" id="btn-down" onclick="slide('down')">▼</button>
            <button class="dir-btn" id="btn-right" onclick="slide('right')">▶</button>
        </div>
    </div>

    <script>
        const cells = Array.from({ length: 16 }, (_, i) => document.getElementById(`c${i}`));
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let board = Array(16).fill(0);
        let score = 0;
        let gameOver = false;

        function initGame() {
            board = Array(16).fill(0);
            score = 0;
            gameOver = false;
            scoreEl.innerText = score;
            spawnNumber();
            spawnNumber();
            updateUI();
        }

        function spawnNumber() {
            const emptyIndices = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
            if (emptyIndices.length > 0) {
                const randIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                board[randIdx] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function updateUI() {
            board.forEach((val, idx) => {
                const cell = cells[idx];
                cell.innerText = val > 0 ? val : '';
                cell.className = 'cell' + (val > 0 ? ` val-${val}` : '');
            });
        }

        function rotateBoardClockwise() {
            let newBoard = Array(16).fill(0);
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    newBoard[c * 4 + (3 - r)] = board[r * 4 + c];
                }
            }
            board = newBoard;
        }

        function slideLeft() {
            let moved = false;
            for (let r = 0; r < 4; r++) {
                let row = board.slice(r * 4, r * 4 + 4).filter(val => val > 0);
                let newRow = [];
                for (let i = 0; i < row.length; i++) {
                    if (row[i] === row[i + 1]) {
                        newRow.push(row[i] * 2);
                        score += row[i] * 2;
                        i++;
                        moved = true;
                    } else {
                        newRow.push(row[i]);
                    }
                }
                while (newRow.length < 4) {
                    newRow.push(0);
                }
                for (let c = 0; c < 4; c++) {
                    const idx = r * 4 + c;
                    if (board[idx] !== newRow[c]) {
                        moved = true;
                    }
                    board[idx] = newRow[c];
                }
            }
            return moved;
        }

        function slide(dir) {
            if (!userId || gameOver) return;

            let rotations = 0;
            if (dir === 'up') rotations = 3;
            if (dir === 'right') rotations = 2;
            if (dir === 'down') rotations = 1;

            for (let i = 0; i < rotations; i++) {
                rotateBoardClockwise();
            }

            const moved = slideLeft();

            const reverseRotations = (4 - rotations) % 4;
            for (let i = 0; i < reverseRotations; i++) {
                rotateBoardClockwise();
            }

            if (moved) {
                spawnNumber();
                updateUI();
                scoreEl.innerText = score;
                if (checkGameOver()) {
                    triggerGameOver();
                }
            }
        }

        function checkGameOver() {
            if (board.includes(0)) return false;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const current = board[r * 4 + c];
                    if (c < 3 && current === board[r * 4 + c + 1]) return false;
                    if (r < 3 && current === board[(r + 1) * 4 + c]) return false;
                }
            }
            return true;
        }

        // Swipe Gesture Detection
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!userId || gameOver) return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 40) {
                    if (diffX > 0) slide('right');
                    else slide('left');
                }
            } else {
                if (Math.abs(diffY) > 40) {
                    if (diffY > 0) slide('down');
                    else slide('up');
                }
            }
        }, { passive: true });

        // Key bindings
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') slide('up');
            if (e.key === 'ArrowLeft') slide('left');
            if (e.key === 'ArrowDown') slide('down');
            if (e.key === 'ArrowRight') slide('right');
        });

        function triggerGameOver() {
            gameOver = true;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            // Reward 1 coin per 10 points (maximum 60 coins)
            const rewardCoins = Math.min(60, Math.floor(score / 10));

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Number Slider' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    console.error("Score submission failed:", err);
                    syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Earn more points to qualify for coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            gameOverScreen.style.display = 'none';
            initGame();
        }

        if (userId) {
            initGame();
        }
    </script>
</body>
</html>
