<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Word Scramble</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin-bottom: 30px; z-index: 10; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #eab308; border-bottom: 2px solid rgba(234, 179, 8, 0.4); }
        #roundBoard { color: #a855f7; border-bottom: 2px solid rgba(168, 85, 247, 0.4); }
        #wordContainer { margin: 20px 0; text-align: center; }
        #scrambledText { font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: #e2e8f0; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        #prompt { font-size: 1.1rem; color: #9ca3af; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        #answerArea { display: flex; gap: 8px; justify-content: center; height: 50px; margin-bottom: 30px; min-width: 250px; border-bottom: 2px dashed rgba(255,255,255,0.2); padding-bottom: 5px; }
        .letter-slot { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; font-size: 1.5rem; font-weight: 700; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        
        #lettersGrid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 360px; margin-bottom: 30px; z-index: 5; }
        .letter-bubble { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .letter-bubble:active { transform: scale(0.9); }
        .letter-bubble.selected { opacity: 0.2; pointer-events: none; }

        #controls { display: flex; gap: 12px; z-index: 5; }
        button.action-btn { padding: 12px 24px; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s ease-in-out; }
        #clearBtn { background: #475569; color: #fff; }
        #submitBtn { background: #38bdf8; color: #030712; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
        #gameOverScreen p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #fbbf24; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; }
        button.play-btn { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button.play-btn:hover { background: #0ea5e9; transform: translateY(-3px); }
        #authScreen h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">⭐ SCORE: <span id="score">0</span></div>
            <div id="roundBoard" class="glass-card">🧩 ROUND: <span id="round">1/5</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Word Puzzle Complete!</h2>
            <p>Total score: <span><span id="finalScore">0</span> coins earned</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button class="play-btn" id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="prompt">Unscramble the word:</div>
        <div id="wordContainer">
            <div id="scrambledText">OINCS</div>
        </div>

        <div id="answerArea"></div>

        <div id="lettersGrid"></div>

        <div id="controls">
            <button class="action-btn" id="clearBtn" onclick="clearAnswer()">Clear</button>
            <button class="action-btn" id="submitBtn" onclick="submitAnswer()">Submit</button>
        </div>
    </div>

    <script>
        const scrambledTextEl = document.getElementById('scrambledText');
        const answerArea = document.getElementById('answerArea');
        const lettersGrid = document.getElementById('lettersGrid');
        const scoreEl = document.getElementById('score');
        const roundEl = document.getElementById('round');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const wordPool = [
            'COINS', 'REWARDS', 'ARCADE', 'EARN', 'WALLET', 
            'SUPPORT', 'GAMES', 'WINNER', 'BONUS', 'SPIN', 
            'SCRATCH', 'REFER', 'DAILY', 'TOWER', 'BLOCK'
        ];

        let currentWord = '';
        let scrambledWord = '';
        let selectedLetters = [];
        let score = 0;
        let round = 1;
        let activeIndices = []; // Keep track of letters chosen

        function scramble(word) {
            let arr = word.split('');
            do {
                arr.sort(() => Math.random() - 0.5);
            } while (arr.join('') === word);
            return arr.join('');
        }

        function loadRound() {
            currentWord = wordPool[Math.floor(Math.random() * wordPool.length)];
            scrambledWord = scramble(currentWord);
            selectedLetters = [];
            activeIndices = [];

            // Render Slots
            answerArea.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                answerArea.appendChild(slot);
            }

            // Render Bubbles
            lettersGrid.innerHTML = '';
            scrambledWord.split('').forEach((letter, idx) => {
                const bubble = document.createElement('div');
                bubble.className = 'letter-bubble';
                bubble.innerText = letter;
                bubble.dataset.idx = idx;
                bubble.addEventListener('click', () => tapLetter(bubble, letter, idx));
                lettersGrid.appendChild(bubble);
            });

            roundEl.innerText = `${round}/5`;
        }

        function tapLetter(bubble, letter, idx) {
            if (bubble.classList.contains('selected')) return;

            bubble.classList.add('selected');
            selectedLetters.push({ letter, idx });
            activeIndices.push(idx);

            // Update Slots
            const slots = document.querySelectorAll('.letter-slot');
            slots[selectedLetters.length - 1].innerText = letter;
        }

        function clearAnswer() {
            selectedLetters = [];
            activeIndices = [];
            const slots = document.querySelectorAll('.letter-slot');
            slots.forEach(slot => slot.innerText = '');

            const bubbles = document.querySelectorAll('.letter-bubble');
            bubbles.forEach(bubble => bubble.classList.remove('selected'));
        }

        function submitAnswer() {
            if (!userId) return;

            const userAns = selectedLetters.map(x => x.letter).join('');
            if (userAns === currentWord) {
                score += 10;
                scoreEl.innerText = score;
                
                if (round >= 5) {
                    triggerGameOver();
                } else {
                    round++;
                    loadRound();
                }
            } else {
                alert("Incorrect word! Try clearing and matching again.");
            }
        }

        function triggerGameOver() {
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            fetch('/api/games/submit-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, score: score, gameName: 'Word Scramble' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                } else {
                    syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                }
                restartBtn.style.display = "block";
            })
            .catch(err => {
                console.error("Score submission failed:", err);
                syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                restartBtn.style.display = "block";
            });
        }

        function resetGame() {
            score = 0;
            round = 1;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            loadRound();
        }

        if (userId) {
            loadRound();
        }
    </script>
</body>
</html>
