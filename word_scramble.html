<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Word Scramble Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin-bottom: 30px; z-index: 10; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #0F172A; }
        #scoreBoard { color: #F59E0B; border-left: 4px solid #F59E0B; }
        #roundBoard { color: #8B5CF6; border-left: 4px solid #8B5CF6; }
        #wordContainer { margin: 20px 0; text-align: center; }
        #scrambledText { font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: #0F172A; }
        #prompt { font-size: 1.1rem; color: #64748B; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        #answerArea { display: flex; gap: 8px; justify-content: center; height: 50px; margin-bottom: 30px; min-width: 250px; border-bottom: 2px dashed #CBD5E1; padding-bottom: 5px; }
        .letter-slot { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #E2E8F0; border-radius: 12px; font-size: 1.5rem; font-weight: 900; color: #06B6D4; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); }
        
        #lettersGrid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 360px; margin-bottom: 30px; z-index: 5; }
        .letter-bubble { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 900; cursor: pointer; background: #FFFFFF; border: 2px solid #E2E8F0; color: #06B6D4; box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06); transition: transform 0.1s; }
        .letter-bubble:active { transform: scale(0.9); }
        .letter-bubble.selected { opacity: 0.3; pointer-events: none; }

        #controls { display: flex; gap: 12px; z-index: 5; }
        button.action-btn { padding: 12px 28px; font-size: 0.95rem; font-weight: 800; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s ease; }
        #clearBtn { background: #E2E8F0; color: #475569; }
        #submitBtn { background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%); color: #FFFFFF; box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3); }

        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); color: #06B6D4; margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button.play-btn { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3); transition: all 0.2s ease; }
        button.play-btn:hover { transform: translateY(-2px); }
        #authScreen h2 { font-size: 2rem; color: #EF4444; margin-bottom: 16px; }
        #authScreen p { color: #64748B; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">⭐ SCORE: <span id="score">0</span></div>
            <div id="roundBoard" class="glass-card">🧩 ROUND: <span id="round">1/5</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Word Puzzle Complete!</h2>
            <p>Total score: <span><span id="finalScore">0</span> coins earned</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button class="play-btn" id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="prompt">Unscramble the word:</div>
        <div id="wordContainer">
            <div id="scrambledText">OINCS</div>
        </div>

        <div id="answerArea"></div>

        <div id="lettersGrid"></div>

        <div id="controls">
            <button class="action-btn" id="clearBtn" onclick="clearAnswer()">Clear</button>
            <button class="action-btn" id="submitBtn" onclick="submitAnswer()">Submit</button>
        </div>
    </div>

    <script>
        const scrambledTextEl = document.getElementById('scrambledText');
        const answerArea = document.getElementById('answerArea');
        const lettersGrid = document.getElementById('lettersGrid');
        const scoreEl = document.getElementById('score');
        const roundEl = document.getElementById('round');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const wordPool = [
            'COINS', 'REWARDS', 'ARCADE', 'EARN', 'WALLET', 
            'SUPPORT', 'GAMES', 'WINNER', 'BONUS', 'SPIN', 
            'SCRATCH', 'REFER', 'DAILY', 'TOWER', 'BLOCK'
        ];

        let currentWord = '';
        let scrambledWord = '';
        let selectedLetters = [];
        let score = 0;
        let round = 1;
        let activeIndices = [];

        function playLetterTapSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 + (selectedLetters.length * 50), audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch(e) {}
        }

        function playWordSuccessSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + (idx * 0.06);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.12);
                });
            } catch(e) {}
        }

        function playWordWrongSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function scramble(word) {
            let arr = word.split('');
            do {
                arr.sort(() => Math.random() - 0.5);
            } while (arr.join('') === word);
            return arr.join('');
        }

        function loadRound() {
            currentWord = wordPool[Math.floor(Math.random() * wordPool.length)];
            scrambledWord = scramble(currentWord);
            selectedLetters = [];
            activeIndices = [];

            answerArea.innerHTML = '';
            for (let i = 0; i < currentWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                answerArea.appendChild(slot);
            }

            lettersGrid.innerHTML = '';
            scrambledWord.split('').forEach((letter, idx) => {
                const bubble = document.createElement('div');
                bubble.className = 'letter-bubble';
                bubble.innerText = letter;
                bubble.dataset.idx = idx;
                bubble.addEventListener('click', () => tapLetter(bubble, letter, idx));
                lettersGrid.appendChild(bubble);
            });

            roundEl.innerText = `${round}/5`;
        }

        function tapLetter(bubble, letter, idx) {
            if (bubble.classList.contains('selected')) return;

            playLetterTapSound();
            bubble.classList.add('selected');
            selectedLetters.push({ letter, idx });
            activeIndices.push(idx);

            const slots = document.querySelectorAll('.letter-slot');
            slots[selectedLetters.length - 1].innerText = letter;
        }

        function clearAnswer() {
            selectedLetters = [];
            activeIndices = [];
            const slots = document.querySelectorAll('.letter-slot');
            slots.forEach(slot => slot.innerText = '');

            const bubbles = document.querySelectorAll('.letter-bubble');
            bubbles.forEach(bubble => bubble.classList.remove('selected'));
        }

        function submitAnswer() {
            if (!userId) return;

            const userAns = selectedLetters.map(x => x.letter).join('');
            if (userAns === currentWord) {
                playWordSuccessSound();
                score += 10;
                scoreEl.innerText = score;
                
                if (round >= 5) {
                    triggerGameOver();
                } else {
                    round++;
                    loadRound();
                }
            } else {
                playWordWrongSound();
                alert("Incorrect word! Try clearing and matching again.");
            }
        }

        function triggerGameOver() {
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing rewards...";
            restartBtn.style.display = "none";

            fetch('/api/games/submit-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, score: score, gameName: 'Word Scramble' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                    if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Word Scramble' }, '*'); }
                } else {
                    syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                }
                restartBtn.style.display = "block";
            })
            .catch(err => {
                syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                restartBtn.style.display = "block";
            });
        }

        function resetGame() {
            score = 0;
            round = 1;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            loadRound();
        }

        if (userId) {
            loadRound();
        }
    </script>
</body>
</html>
