<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LightPlex Arcade - Star Catcher</title>
    <style>
        /* Reset and prevent accidental scrolling/bouncing on mobile devices */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        
        body {
            background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        
        /* Wrapper stretches cleanly to 100% of any viewport size */
        #gameWrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Frosted Glassmorphism Neon UI Overlay */
        #uiOverlay {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            letter-spacing: 0.05em;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #scoreBoard { 
            color: #fbbf24; 
            border-bottom: 2px solid rgba(251, 191, 36, 0.4);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
        }
        
        #livesBoard { 
            color: #f87171; 
            border-bottom: 2px solid rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.15);
        }

        /* Immersive Game Over / Auth Screen */
        #gameOverScreen, #authScreen {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        #gameOverScreen {
            display: none;
        }

        #gameOverScreen h2 {
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            color: #f87171;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(248, 113, 113, 0.6);
            animation: pulse 2s infinite alternate;
        }

        #gameOverScreen p {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            color: #9ca3af;
            margin-bottom: 12px;
        }

        #gameOverScreen span {
            color: #fbbf24;
            font-weight: 800;
        }

        #syncStatus {
            font-size: 1rem;
            color: #34d399;
            margin-bottom: 32px;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
        }

        /* High-fidelity Neon Action Button */
        button {
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            background: #38bdf8;
            color: #030712;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.45);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(14, 165, 233, 0.75);
        }

        button:active {
            transform: translateY(-1px);
        }

        #authScreen h2 {
            font-size: clamp(2rem, 8vw, 3rem);
            color: #38bdf8;
            margin-bottom: 16px;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }

        #authScreen p {
            color: #9ca3af;
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
        }

        @keyframes pulse {
            0% { transform: scale(0.97); opacity: 0.9; }
            100% { transform: scale(1.03); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">⭐ SCORE: <span id="score">0</span></div>
            <div id="livesBoard" class="glass-card">❤️ LIVES: <span id="lives">3</span></div>
        </div>

        <!-- Invalid Authentication / Mode Access State -->
        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Game Over</h2>
            <p>Final score calculated: <span><span id="finalScore">0</span> pts</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Deploy Again</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        // Extract user context from query params
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        // Logic & Config States
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let gameObjects = [];
        let spawnTimer = 0;
        let spawnInterval = 80; // Slower spawn rhythm

        const paddle = {
            width: 120,
            height: 14,
            x: 0,
            y: 0,
            color: '#38bdf8',
            radius: 7
        };

        // Screen Adaptation System (Fully Responsive Engine)
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Re-adjust paddle properties perfectly matching device parameters
            paddle.y = canvas.height - 60;
            
            // Adjust paddle width dynamically: slightly narrower on smaller phone screens
            paddle.width = canvas.width < 500 ? 100 : 130;

            if (paddle.x === 0 || paddle.x > canvas.width) {
                paddle.x = canvas.width / 2 - paddle.width / 2;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Control Inputs: Desktop + Mobile Mouse tracking & dragging hooks
        window.addEventListener('mousemove', (e) => {
            if (userId) movePaddle(e.clientX);
        });

        window.addEventListener('touchmove', (e) => {
            if (userId && e.touches.length > 0) {
                movePaddle(e.touches[0].clientX);
            }
        }, { passive: true });

        function movePaddle(clientX) {
            paddle.x = clientX - paddle.width / 2;
            // Screen constraint logic
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x > canvas.width - paddle.width) paddle.x = canvas.width - paddle.width;
        }

        // Particle blueprints configured for calm, steady, readable fall physics
        class FallingItem {
            constructor() {
                // Adaptive sizes scaling to fit tiny mobile displays or large desktops safely
                this.radius = Math.min(canvas.width, canvas.height) * 0.022 + Math.random() * 3;
                if(this.radius < 12) this.radius = 12; // Minimum thickness guarantee
                if(this.radius > 26) this.radius = 26; // Maximum thickness limitation

                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius;
                
                // Calm, slow initial drop speed values
                this.speed = (Math.random() * 0.8 + 1.2) + (score * 0.035); 
                
                this.type = Math.random() > 0.35 ? 'star' : 'asteroid'; // Balance distribution
                this.color = this.type === 'star' ? '#fbbf24' : '#f87171';
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Render structural glow map
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0; // Performance preservation reset
            }
        }

        function spawnObjects() {
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                gameObjects.push(new FallingItem());
                spawnTimer = 0;
                
                // Steady gradual pacing acceleration calculation
                spawnInterval = Math.max(38, 80 - Math.floor(score / 3));
            }
        }

        function playCatchSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playHitSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function checkCollisions() {
            for (let i = gameObjects.length - 1; i >= 0; i--) {
                let item = gameObjects[i];

                if (item.y + item.radius >= paddle.y && 
                    item.y - item.radius <= paddle.y + paddle.height &&
                    item.x + item.radius >= paddle.x && 
                    item.x - item.radius <= paddle.x + paddle.width) {
                    
                    if (item.type === 'star') {
                        score++;
                        scoreEl.innerText = score;
                        playCatchSound();
                    } else {
                        lives--;
                        livesEl.innerText = lives;
                        playHitSound();
                        if (lives <= 0) triggerGameOver();
                    }
                    gameObjects.splice(i, 1);
                    continue;
                }

                if (item.y - item.radius > canvas.height) {
                    if (item.type === 'star') {
                        lives--;
                        livesEl.innerText = lives;
                        playHitSound();
                        if (lives <= 0) triggerGameOver();
                    }
                    gameObjects.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            gameOver = true;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            // Submit score API call
            if (score > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: userId, score: score, gameName: 'Star Catcher' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    console.error("Score submission failed:", err);
                    syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Catch at least 1 star to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameObjects = [];
            spawnInterval = 80;
            gameOver = false;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            gameOverScreen.style.display = 'none';
            animate();
        }

        // Loop Animation Processing Engine
        function animate() {
            if (!userId) return;
            if (gameOver) return;

            // Screen frame canvas refreshing clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Player Interactive Paddle with rounded borders
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, paddle.radius);
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 25;
            ctx.shadowColor = paddle.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Tick logic updates
            spawnObjects();
            
            gameObjects.forEach(item => {
                item.update();
                item.draw();
            });

            checkCollisions();

            requestAnimationFrame(animate);
        }

        // Run application
        if (userId) {
            animate();
        }
    </script>
</body>
</html>
