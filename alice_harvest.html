<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Alice Harvest Light</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { 
            background: #F4F7FC; 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; 
        }
        
        #gameWrapper { 
            position: relative; width: 100%; height: 100%; max-width: 480px; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            padding: 16px; 
        }

        #uiOverlay { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; margin-top: 8px; z-index: 10; gap: 10px; 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); 
            border: 1px solid #E2E8F0; padding: 10px 16px; border-radius: 16px; 
            font-weight: 800; font-size: 0.95rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); 
            display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; color: #0F172A;
        }
        #scoreBoard { color: #10B981; border-left: 4px solid #10B981; }
        #timerBoard { color: #F59E0B; border-left: 4px solid #F59E0B; }
        #comboBoard { color: #EC4899; border-left: 4px solid #EC4899; }

        .garden-banner {
            text-align: center; margin: 10px 0 5px 0;
        }
        .garden-banner h2 {
            font-family: 'Fredoka', cursive, sans-serif; font-size: 1.8rem; color: #10B981;
            letter-spacing: 0.5px; font-weight: 700;
        }
        .garden-banner p {
            font-size: 0.85rem; color: #64748B; font-weight: 600;
        }

        #gardenGrid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 100%; max-width: 380px; flex: 1; max-height: 380px;
            margin: 10px 0; z-index: 5; align-content: center;
        }

        .plot-tile {
            background: #FFFFFF;
            border: 2px solid #E2E8F0; border-radius: 20px;
            position: relative; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s, box-shadow 0.2s;
            overflow: hidden; aspect-ratio: 1;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
        }
        
        .plot-tile:active { transform: scale(0.94); }

        .crop-icon {
            font-size: 2.8rem; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
        }

        .stage-empty { opacity: 0; transform: scale(0.2); }
        .stage-sprout { opacity: 0.7; transform: scale(0.6); filter: brightness(0.9); }
        .stage-ripe { 
            opacity: 1; transform: scale(1.1); 
            animation: pulseCrop 0.8s infinite alternate ease-in-out;
        }
        .stage-golden {
            opacity: 1; transform: scale(1.2);
            animation: pulseGolden 0.6s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.8));
        }
        .stage-withered {
            opacity: 0.5; transform: scale(0.8); filter: grayscale(1) contrast(0.7);
        }

        @keyframes pulseCrop {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.15); }
        }

        @keyframes pulseGolden {
            0% { transform: scale(1.15) rotate(-3deg); }
            100% { transform: scale(1.25) rotate(3deg); }
        }

        .float-text {
            position: absolute; font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.4rem; font-weight: 700; color: #F59E0B;
            pointer-events: none; animation: floatUp 0.8s forwards ease-out;
            z-index: 20; text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }

        .plot-progress {
            position: absolute; bottom: 6px; left: 10%; width: 80%; height: 4px;
            background: #E2E8F0; border-radius: 2px; overflow: hidden;
        }
        .plot-progress-fill {
            height: 100%; width: 100%; background: #10B981;
            transition: width 0.1s linear, background-color 0.2s;
        }

        #gameOverScreen, #authScreen { 
            position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); 
            backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 30; padding: 24px; text-align: center; 
        }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { 
            font-family: 'Fredoka', cursive, sans-serif; font-size: 2.5rem; color: #10B981; 
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 900;
        }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span.highlight { color: #F59E0B; font-weight: 900; font-size: 1.3rem; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        
        button.action-btn { 
            padding: 14px 32px; font-size: 1rem; font-weight: 800; 
            background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #fff; 
            border: none; border-radius: 16px; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 1px; 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); 
            transition: all 0.2s ease-in-out; 
        }
        button.action-btn:hover { transform: translateY(-2px); }

        #authScreen h2 { font-size: 2rem; color: #EF4444; margin-bottom: 16px; }
        #authScreen p { color: #64748B; font-size: 1rem; max-width: 360px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card"><i class="fa-solid fa-wheat-awn"></i> <span id="score">0</span></div>
            <div id="timerBoard" class="glass-card"><i class="fa-solid fa-stopwatch"></i> <span id="timer">30</span>s</div>
            <div id="comboBoard" class="glass-card"><i class="fa-solid fa-bolt"></i> x<span id="combo">1</span></div>
        </div>

        <div class="garden-banner">
            <h2>Alice's Harvest Garden</h2>
            <p>Tap ripe crops & golden sunflowers before they wither!</p>
        </div>

        <div id="authScreen" style="display: none;">
            <h2><i class="fa-solid fa-lock"></i> Direct Access Disabled</h2>
            <p>Please open this game directly from the ExtraEarn application to receive daily reward coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2 id="endTitle">Harvest Complete!</h2>
            <p>Total Harvest: <span class="highlight"><span id="finalScore">0</span> Crops</span></p>
            <div id="syncStatus">Syncing reward coins...</div>
            <button class="action-btn" id="restartBtn" onclick="resetGame()" style="display: none;"><i class="fa-solid fa-rotate-right"></i> Harvest Again</button>
        </div>

        <div id="gardenGrid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        const authScreen = document.getElementById('authScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const comboEl = document.getElementById('combo');
        const finalScoreEl = document.getElementById('finalScore');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');
        const gardenGrid = document.getElementById('gardenGrid');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const CROP_TYPES = [
            { icon: '🥕', name: 'Carrot', points: 10, ripeTime: 2500, witherTime: 2000 },
            { icon: '🍓', name: 'Strawberry', points: 15, ripeTime: 2200, witherTime: 1800 },
            { icon: '🎃', name: 'Pumpkin', points: 20, ripeTime: 2800, witherTime: 1600 },
            { icon: '🍅', name: 'Tomato', points: 12, ripeTime: 2400, witherTime: 2000 },
            { icon: '🌻', name: 'Golden Sunflower', points: 50, isGolden: true, ripeTime: 1800, witherTime: 1400 }
        ];

        let score = 0;
        let combo = 1;
        let comboTimer = null;
        let gameTimer = 30;
        let gameInterval = null;
        let spawnTimeout = null;
        let isGameOver = false;

        let plotStates = Array(9).fill(null).map(() => ({
            stage: 'empty',
            crop: null,
            timer: null,
            progress: 100
        }));

        function playHarvestSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playGoldenHarvestSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const notes = [659.25, 830.61, 987.77];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + (idx * 0.06);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.12);
                });
            } catch(e) {}
        }

        function buildGrid() {
            gardenGrid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                tile.className = 'plot-tile';
                tile.dataset.index = i;
                tile.innerHTML = `
                    <div class="crop-icon stage-empty" id="crop-${i}"></div>
                    <div class="plot-progress">
                        <div class="plot-progress-fill" id="progress-${i}"></div>
                    </div>
                `;
                tile.addEventListener('click', () => harvestPlot(i, tile));
                gardenGrid.appendChild(tile);
            }
        }

        function startGame() {
            score = 0;
            combo = 1;
            gameTimer = 30;
            isGameOver = false;

            scoreEl.innerText = score;
            timerEl.innerText = gameTimer;
            comboEl.innerText = combo;

            gameOverScreen.style.display = 'none';

            for (let i = 0; i < 9; i++) {
                clearPlot(i);
            }

            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                gameTimer--;
                timerEl.innerText = gameTimer;
                if (gameTimer <= 0) {
                    endGame();
                }
            }, 1000);

            scheduleNextSpawn();
        }

        function scheduleNextSpawn() {
            if (isGameOver) return;
            const delay = Math.max(400, 1200 - (30 - gameTimer) * 25);
            spawnTimeout = setTimeout(() => {
                spawnRandomCrop();
                scheduleNextSpawn();
            }, delay);
        }

        function spawnRandomCrop() {
            if (isGameOver) return;

            const emptyIndices = plotStates
                .map((p, idx) => p.stage === 'empty' ? idx : null)
                .filter(idx => idx !== null);

            if (emptyIndices.length === 0) return;

            const targetIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            
            const isGolden = Math.random() < 0.15;
            const crop = isGolden ? CROP_TYPES[4] : CROP_TYPES[Math.floor(Math.random() * 4)];

            const plot = plotStates[targetIdx];
            plot.crop = crop;
            plot.stage = 'sprout';

            const cropEl = document.getElementById(`crop-${targetIdx}`);
            const fillEl = document.getElementById(`progress-${targetIdx}`);

            cropEl.innerText = '🌱';
            cropEl.className = 'crop-icon stage-sprout';
            fillEl.style.width = '100%';
            fillEl.style.backgroundColor = '#10B981';

            plot.timer = setTimeout(() => {
                if (isGameOver || plot.stage !== 'sprout') return;
                plot.stage = crop.isGolden ? 'golden' : 'ripe';
                cropEl.innerText = crop.icon;
                cropEl.className = `crop-icon ${crop.isGolden ? 'stage-golden' : 'stage-ripe'}`;
                
                startWitherCountdown(targetIdx, crop.witherTime);
            }, 700);
        }

        function startWitherCountdown(idx, duration) {
            const plot = plotStates[idx];
            const fillEl = document.getElementById(`progress-${idx}`);
            const startTime = Date.now();

            clearInterval(plot.interval);
            plot.interval = setInterval(() => {
                if (isGameOver || (plot.stage !== 'ripe' && plot.stage !== 'golden')) {
                    clearInterval(plot.interval);
                    return;
                }

                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, 1 - (elapsed / duration));
                fillEl.style.width = `${remaining * 100}%`;

                if (remaining < 0.3) {
                    fillEl.style.backgroundColor = '#EF4444';
                }

                if (remaining <= 0) {
                    clearInterval(plot.interval);
                    plot.stage = 'withered';
                    const cropEl = document.getElementById(`crop-${idx}`);
                    cropEl.innerText = '🥀';
                    cropEl.className = 'crop-icon stage-withered';

                    setTimeout(() => clearPlot(idx), 1000);
                }
            }, 50);
        }

        function harvestPlot(idx, tileEl) {
            if (isGameOver || !userId) return;
            const plot = plotStates[idx];

            if (plot.stage === 'ripe' || plot.stage === 'golden') {
                if (plot.stage === 'golden') playGoldenHarvestSound();
                else playHarvestSound();

                const points = plot.crop.points * combo;
                score += points;
                scoreEl.innerText = score;

                combo = Math.min(5, combo + 1);
                comboEl.innerText = combo;

                clearTimeout(comboTimer);
                comboTimer = setTimeout(() => {
                    combo = 1;
                    comboEl.innerText = combo;
                }, 2000);

                showFloatText(tileEl, `+${points}`);
                clearPlot(idx);
            } else if (plot.stage === 'withered') {
                clearPlot(idx);
            }
        }

        function clearPlot(idx) {
            const plot = plotStates[idx];
            clearTimeout(plot.timer);
            clearInterval(plot.interval);
            plot.stage = 'empty';
            plot.crop = null;

            const cropEl = document.getElementById(`crop-${idx}`);
            const fillEl = document.getElementById(`progress-${idx}`);
            if (cropEl) {
                cropEl.innerText = '';
                cropEl.className = 'crop-icon stage-empty';
            }
            if (fillEl) fillEl.style.width = '0%';
        }

        function showFloatText(tileEl, text) {
            const rect = tileEl.getBoundingClientRect();
            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';
            floatEl.innerText = text;
            floatEl.style.left = `${rect.left + rect.width / 2 - 20}px`;
            floatEl.style.top = `${rect.top + 10}px`;
            document.body.appendChild(floatEl);

            setTimeout(() => floatEl.remove(), 800);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearTimeout(spawnTimeout);

            for (let i = 0; i < 9; i++) {
                clearPlot(i);
            }

            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            const rewardCoins = Math.min(50, Math.floor(score / 10));

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Alice Harvest' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                        if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Alice Harvest' }, '*'); }
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Harvest more ripe crops to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            startGame();
        }

        buildGrid();
        if (userId) {
            startGame();
        }
    </script>
</body>
</html>
