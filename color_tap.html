<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Color Tap Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 340px; margin-bottom: 30px; z-index: 10; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #0F172A; }
        #scoreBoard { color: #EC4899; border-left: 4px solid #EC4899; }
        #timerBoard { color: #F59E0B; border-left: 4px solid #F59E0B; }
        #wordContainer { margin: 30px 0; text-align: center; }
        #colorWord { font-size: 3.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; transition: transform 0.1s; }
        #prompt { font-size: 1.1rem; color: #64748B; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        #buttonsGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; max-width: 340px; z-index: 5; }
        .color-btn { height: 80px; border-radius: 20px; border: none; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
        .color-btn:active { transform: scale(0.95); }
        #btn-red { background: linear-gradient(135deg, #EF4444, #DC2626); box-shadow: 0 6px 18px rgba(239, 68, 68, 0.3); }
        #btn-blue { background: linear-gradient(135deg, #3B82F6, #2563EB); box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3); }
        #btn-green { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3); }
        #btn-yellow { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 6px 18px rgba(245, 158, 11, 0.3); }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); color: #EF4444; margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button.action-btn { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(236, 72, 153, 0.3); transition: all 0.2s ease; }
        button.action-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">⭐ SCORE: <span id="score">0</span></div>
            <div id="timerBoard" class="glass-card">⏱️ TIME: <span id="timer">3.0</span>s</div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2 id="endReason">Wrong Match!</h2>
            <p>Score reached: <span><span id="finalScore">0</span> matches</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button class="action-btn" id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="prompt">Tap the actual text color!</div>
        <div id="wordContainer">
            <div id="colorWord">RED</div>
        </div>

        <div id="buttonsGrid">
            <div class="color-btn" id="btn-red" onclick="checkAnswer('RED')"></div>
            <div class="color-btn" id="btn-blue" onclick="checkAnswer('BLUE')"></div>
            <div class="color-btn" id="btn-green" onclick="checkAnswer('GREEN')"></div>
            <div class="color-btn" id="btn-yellow" onclick="checkAnswer('YELLOW')"></div>
        </div>
    </div>

    <script>
        const colorWord = document.getElementById('colorWord');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const endReasonEl = document.getElementById('endReason');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const colors = [
            { name: 'RED', hex: '#EF4444' },
            { name: 'BLUE', hex: '#3B82F6' },
            { name: 'GREEN', hex: '#10B981' },
            { name: 'YELLOW', hex: '#F59E0B' }
        ];

        let score = 0;
        let timeLeft = 3.0;
        let timerInterval = null;
        let correctColorName = '';

        function playTapCorrectSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700 + score * 20, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch(e) {}
        }

        function playTapWrongSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function nextRound() {
            const wordIdx = Math.floor(Math.random() * colors.length);
            const colorIdx = Math.floor(Math.random() * colors.length);

            colorWord.innerText = colors[wordIdx].name;
            colorWord.style.color = colors[colorIdx].hex;
            correctColorName = colors[colorIdx].name;

            timeLeft = Math.max(1.2, 3.0 - (score * 0.08));
            timerEl.innerText = timeLeft.toFixed(1);
            
            colorWord.style.transform = 'scale(1.15)';
            setTimeout(() => { colorWord.style.transform = 'scale(1)'; }, 100);
        }

        function startTimer() {
            clearInterval(timerInterval);
            const startTime = Date.now();
            const startVal = timeLeft;
            
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const currentVal = Math.max(0, startVal - elapsed);
                timerEl.innerText = currentVal.toFixed(1);

                if (currentVal <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver('Time Out!');
                }
            }, 50);
        }

        function checkAnswer(tappedColor) {
            if (!userId || gameOverScreen.style.display === 'flex') return;

            if (tappedColor === correctColorName) {
                playTapCorrectSound();
                score++;
                scoreEl.innerText = score;
                nextRound();
                startTimer();
            } else {
                playTapWrongSound();
                triggerGameOver('Wrong Color!');
            }
        }

        function triggerGameOver(reason) {
            clearInterval(timerInterval);
            finalScoreEl.innerText = score;
            endReasonEl.innerText = reason;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            const rewardCoins = Math.min(60, score * 2);

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Color Tap' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                        if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Color Tap' }, '*'); }
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Match at least 1 color correctly to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            nextRound();
            startTimer();
        }

        if (userId) {
            nextRound();
            startTimer();
        }
    </script>
</body>
</html>
