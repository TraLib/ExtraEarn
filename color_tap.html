<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Color Tap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 340px; margin-bottom: 30px; z-index: 10; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #34d399; border-bottom: 2px solid rgba(52, 211, 153, 0.4); }
        #timerBoard { color: #f87171; border-bottom: 2px solid rgba(248, 113, 113, 0.4); }
        #wordContainer { margin: 40px 0; text-align: center; }
        #colorWord { font-size: 3.5rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; transition: transform 0.1s; }
        #prompt { font-size: 1.1rem; color: #9ca3af; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        #buttonsGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; max-width: 340px; z-index: 5; }
        .color-btn { height: 75px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
        .color-btn:active { transform: scale(0.94); }
        #btn-red { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35); }
        #btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35); }
        #btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35); }
        #btn-yellow { background: linear-gradient(135deg, #eab308, #a16207); box-shadow: 0 4px 15px rgba(234, 179, 8, 0.35); }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: 2.5rem; color: #f87171; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
        #gameOverScreen p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #fbbf24; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; }
        button.action-btn { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button.action-btn:hover { background: #0ea5e9; transform: translateY(-3px); }
        #authScreen h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">⭐ SCORE: <span id="score">0</span></div>
            <div id="timerBoard" class="glass-card">⏱️ TIME: <span id="timer">3.0</span>s</div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2 id="endReason">Wrong Match!</h2>
            <p>Score reached: <span><span id="finalScore">0</span> matches</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button class="action-btn" id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="prompt">Tap the actual text color!</div>
        <div id="wordContainer">
            <div id="colorWord">RED</div>
        </div>

        <div id="buttonsGrid">
            <div class="color-btn" id="btn-red" onclick="checkAnswer('RED')"></div>
            <div class="color-btn" id="btn-blue" onclick="checkAnswer('BLUE')"></div>
            <div class="color-btn" id="btn-green" onclick="checkAnswer('GREEN')"></div>
            <div class="color-btn" id="btn-yellow" onclick="checkAnswer('YELLOW')"></div>
        </div>
    </div>

    <script>
        const colorWord = document.getElementById('colorWord');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const endReasonEl = document.getElementById('endReason');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        const colors = [
            { name: 'RED', hex: '#ef4444' },
            { name: 'BLUE', hex: '#3b82f6' },
            { name: 'GREEN', hex: '#10b981' },
            { name: 'YELLOW', hex: '#eab308' }
        ];

        let score = 0;
        let timeLeft = 3.0;
        let timerInterval = null;
        let correctColorName = '';

        function nextRound() {
            // Random word
            const wordIdx = Math.floor(Math.random() * colors.length);
            // Random color
            const colorIdx = Math.floor(Math.random() * colors.length);

            colorWord.innerText = colors[wordIdx].name;
            colorWord.style.color = colors[colorIdx].hex;
            correctColorName = colors[colorIdx].name;

            timeLeft = Math.max(1.2, 3.0 - (score * 0.08)); // Make it progressively faster!
            timerEl.innerText = timeLeft.toFixed(1);
            
            // Pop effect
            colorWord.style.transform = 'scale(1.2)';
            setTimeout(() => { colorWord.style.transform = 'scale(1)'; }, 100);
        }

        function startTimer() {
            clearInterval(timerInterval);
            const startTime = Date.now();
            const startVal = timeLeft;
            
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const currentVal = Math.max(0, startVal - elapsed);
                timerEl.innerText = currentVal.toFixed(1);

                if (currentVal <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver('Time Out!');
                }
            }, 50);
        }

        function checkAnswer(tappedColor) {
            if (!userId || gameOverScreen.style.display === 'flex') return;

            if (tappedColor === correctColorName) {
                score++;
                scoreEl.innerText = score;
                nextRound();
                startTimer();
            } else {
                triggerGameOver('Wrong Color!');
            }
        }

        function triggerGameOver(reason) {
            clearInterval(timerInterval);
            finalScoreEl.innerText = score;
            endReasonEl.innerText = reason;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            // Reward 2 coins per correct answer (maximum 60 coins)
            const rewardCoins = Math.min(60, score * 2);

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Color Tap' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    console.error("Score submission failed:", err);
                    syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Match at least 1 color correctly to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            nextRound();
            startTimer();
        }

        if (userId) {
            nextRound();
            startTimer();
        }
    </script>
</body>
</html>
