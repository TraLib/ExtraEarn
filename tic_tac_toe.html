<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Tic Tac Toe Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: center; width: 100%; max-width: 320px; margin-bottom: 24px; z-index: 10; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 24px; border-radius: 16px; font-weight: 800; font-size: 1.1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #10B981; border-left: 4px solid #10B981; }
        #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 320px; aspect-ratio: 1; z-index: 5; }
        .cell { background: #FFFFFF; border: 2px solid #E2E8F0; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; aspect-ratio: 1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: #EF4444; }
        .cell.o { color: #06B6D4; }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }
        #turnIndicator { margin-top: 20px; font-size: 1.1rem; color: #64748B; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🏆 WINS: <span id="wins">0</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2 id="endTitle">YOU WON!</h2>
            <p id="endDesc">Matches won this session.</p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="board">
            <div class="cell" data-idx="0"></div>
            <div class="cell" data-idx="1"></div>
            <div class="cell" data-idx="2"></div>
            <div class="cell" data-idx="3"></div>
            <div class="cell" data-idx="4"></div>
            <div class="cell" data-idx="5"></div>
            <div class="cell" data-idx="6"></div>
            <div class="cell" data-idx="7"></div>
            <div class="cell" data-idx="8"></div>
        </div>

        <div id="turnIndicator">YOUR TURN (X)</div>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const winsEl = document.getElementById('wins');
        const endTitleEl = document.getElementById('endTitle');
        const endDescEl = document.getElementById('endDesc');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');
        const turnIndicator = document.getElementById('turnIndicator');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let board = ['', '', '', '', '', '', '', '', ''];
        let wins = 0;
        let isPlayerTurn = true;
        let gameActive = true;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function playMoveSound(player) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = player === 'X' ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(player === 'X' ? 523.25 : 659.25, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + (idx * 0.07);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.15);
                });
            } catch(e) {}
        }

        cells.forEach(cell => {
            cell.addEventListener('click', () => handleCellClick(cell));
        });

        function handleCellClick(cell) {
            const idx = parseInt(cell.dataset.idx);
            if (!userId || !isPlayerTurn || !gameActive || board[idx] !== '') return;

            makeMove(idx, 'X');
            
            if (checkWin('X')) {
                wins++;
                winsEl.innerText = wins;
                triggerGameOver('win');
                return;
            }

            if (board.every(cell => cell !== '')) {
                triggerGameOver('draw');
                return;
            }

            isPlayerTurn = false;
            turnIndicator.innerText = "AI IS THINKING...";
            setTimeout(aiMove, 600);
        }

        function makeMove(idx, player) {
            playMoveSound(player);
            board[idx] = player;
            cells[idx].innerText = player;
            cells[idx].classList.add(player.toLowerCase());
        }

        function aiMove() {
            if (!gameActive) return;

            let bestMove = findWinningMove('O') || findWinningMove('X') || takeCenter() || takeCorner() || takeRandom();

            if (bestMove !== null) {
                makeMove(bestMove, 'O');
            }

            if (checkWin('O')) {
                triggerGameOver('loss');
                return;
            }

            if (board.every(cell => cell !== '')) {
                triggerGameOver('draw');
                return;
            }

            isPlayerTurn = true;
            turnIndicator.innerText = "YOUR TURN (X)";
        }

        function findWinningMove(player) {
            for (let cond of winConditions) {
                const [a, b, c] = cond;
                if (board[a] === player && board[b] === player && board[c] === '') return c;
                if (board[a] === player && board[c] === player && board[b] === '') return b;
                if (board[b] === player && board[c] === player && board[a] === '') return a;
            }
            return null;
        }

        function takeCenter() {
            return board[4] === '' ? 4 : null;
        }

        function takeCorner() {
            const corners = [0, 2, 6, 8].filter(idx => board[idx] === '');
            return corners.length > 0 ? corners[Math.floor(Math.random() * corners.length)] : null;
        }

        function takeRandom() {
            const empties = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            return empties.length > 0 ? empties[Math.floor(Math.random() * empties.length)] : null;
        }

        function checkWin(player) {
            return winConditions.some(cond => {
                return cond.every(idx => board[idx] === player);
            });
        }

        function triggerGameOver(result) {
            gameActive = false;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            let rewardCoins = 0;
            if (result === 'win') {
                playWinSound();
                endTitleEl.innerText = "YOU WON!";
                endTitleEl.style.color = "#10B981";
                rewardCoins = 15;
            } else if (result === 'draw') {
                endTitleEl.innerText = "IT'S A DRAW";
                endTitleEl.style.color = "#F59E0B";
                rewardCoins = 5;
            } else {
                endTitleEl.innerText = "AI DEFEATED YOU";
                endTitleEl.style.color = "#EF4444";
                rewardCoins = 0;
            }

            endDescEl.innerText = `Claimed +${rewardCoins} Coins.`;

            if (rewardCoins > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardCoins, gameName: 'Tic Tac Toe' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                        if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Tic Tac Toe' }, '*'); }
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Win or draw the next match to claim coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            isPlayerTurn = true;
            gameActive = true;
            turnIndicator.innerText = "YOUR TURN (X)";
            cells.forEach(cell => {
                cell.innerText = '';
                cell.className = 'cell';
            });
            gameOverScreen.style.display = 'none';
        }
    </script>
</body>
</html>
