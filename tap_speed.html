<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Speed Tap Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 40px; z-index: 10; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #0F172A; }
        #scoreBoard { color: #10B981; border-left: 4px solid #10B981; }
        #timerBoard { color: #F59E0B; border-left: 4px solid #F59E0B; }
        #tapArea { display: flex; align-items: center; justify-content: center; width: 220px; height: 220px; border-radius: 50%; background: linear-gradient(135deg, #10B981 0%, #059669 100%); border: 8px solid #FFFFFF; box-shadow: 0 12px 36px rgba(16, 185, 129, 0.35); cursor: pointer; transition: transform 0.05s, box-shadow 0.1s; z-index: 5; }
        #tapArea:active { transform: scale(0.92); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
        #tapAreaText { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; color: #FFFFFF; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.15); }
        #instructions { margin-top: 30px; font-size: 1rem; color: #64748B; text-align: center; max-width: 300px; font-weight: 600; line-height: 1.5; }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); color: #10B981; margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🔥 TAPS: <span id="score">0</span></div>
            <div id="timerBoard" class="glass-card">⏱️ SECS: <span id="timeLeft">15.0</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Time's Up!</h2>
            <p>Total taps registered: <span><span id="finalScore">0</span> taps</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="tapArea">
            <span id="tapAreaText">TAP!</span>
        </div>

        <div id="instructions">Tap the button as fast as you can once the timer starts!</div>
    </div>

    <script>
        const tapArea = document.getElementById('tapArea');
        const tapAreaText = document.getElementById('tapAreaText');
        const scoreEl = document.getElementById('score');
        const timeLeftEl = document.getElementById('timeLeft');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let score = 0;
        let timeLeft = 15.0;
        let gameActive = false;
        let timerInterval = null;

        function playSpeedTapSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = 600 + (score % 20) * 35;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function startTimer() {
            gameActive = true;
            timeLeft = 15.0;
            timeLeftEl.innerText = timeLeft.toFixed(1);
            
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, 15.0 - elapsed);
                timeLeftEl.innerText = timeLeft.toFixed(1);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver();
                }
            }, 100);
        }

        tapArea.addEventListener('pointerdown', (e) => {
            if (!userId || gameOverScreen.style.display === 'flex') return;
            
            playSpeedTapSound();
            if (!gameActive) {
                startTimer();
                tapAreaText.innerText = "TAP FAST!";
            }

            score++;
            scoreEl.innerText = score;
        });

        function triggerGameOver() {
            gameActive = false;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            const rewardScore = Math.min(60, Math.floor(score / 2));

            if (rewardScore > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardScore, gameName: 'Speed Tap' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                        if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Speed Tap' }, '*'); }
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Tap faster to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            timeLeft = 15.0;
            gameActive = false;
            scoreEl.innerText = score;
            timeLeftEl.innerText = timeLeft.toFixed(1);
            tapAreaText.innerText = "TAP!";
            gameOverScreen.style.display = 'none';
        }
    </script>
</body>
</html>
