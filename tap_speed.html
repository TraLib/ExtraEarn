<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Speed Tap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #uiOverlay { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 40px; z-index: 10; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 14px 20px; border-radius: 16px; font-weight: 700; font-size: 1rem; letter-spacing: 0.05em; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #fbbf24; border-bottom: 2px solid rgba(251, 191, 36, 0.4); }
        #timerBoard { color: #f87171; border-bottom: 2px solid rgba(248, 113, 113, 0.4); }
        #tapArea { display: flex; align-items: center; justify-content: center; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%); border: 8px solid rgba(255,255,255,0.1); box-shadow: 0 0 50px rgba(59, 130, 246, 0.6); cursor: pointer; transition: transform 0.05s, box-shadow 0.1s; z-index: 5; }
        #tapArea:active { transform: scale(0.92); box-shadow: 0 0 80px rgba(59, 130, 246, 0.9); }
        #tapAreaText { font-size: 2.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        #instructions { margin-top: 30px; font-size: 1rem; color: #9ca3af; text-align: center; max-width: 300px; line-height: 1.5; }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: 2.5rem; color: #fbbf24; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 40px rgba(251, 191, 36, 0.6); }
        #gameOverScreen p { font-size: 1.2rem; color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #34d399; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; }
        button { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button:hover { background: #0ea5e9; transform: translateY(-3px); }
        #authScreen h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🔥 TAPS: <span id="score">0</span></div>
            <div id="timerBoard" class="glass-card">⏱️ SECS: <span id="timeLeft">15.0</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Time's Up!</h2>
            <p>Total taps registered: <span><span id="finalScore">0</span> taps</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <div id="tapArea">
            <span id="tapAreaText">TAP!</span>
        </div>

        <div id="instructions">Tap the button as fast as you can once the timer starts!</div>
    </div>

    <script>
        const tapArea = document.getElementById('tapArea');
        const tapAreaText = document.getElementById('tapAreaText');
        const scoreEl = document.getElementById('score');
        const timeLeftEl = document.getElementById('timeLeft');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let score = 0;
        let timeLeft = 15.0;
        let gameActive = false;
        let timerInterval = null;

        function startTimer() {
            gameActive = true;
            timeLeft = 15.0;
            timeLeftEl.innerText = timeLeft.toFixed(1);
            
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, 15.0 - elapsed);
                timeLeftEl.innerText = timeLeft.toFixed(1);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver();
                }
            }, 100);
        }

        tapArea.addEventListener('pointerdown', (e) => {
            if (!userId || gameOverScreen.style.display === 'flex') return;
            
            if (!gameActive) {
                startTimer();
                tapAreaText.innerText = "TAP FAST!";
            }

            score++;
            scoreEl.innerText = score;
        });

        function triggerGameOver() {
            gameActive = false;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            // Limit reward maximum to 60 coins (e.g. 1 coin per 2 taps)
            const rewardScore = Math.min(60, Math.floor(score / 2));

            if (rewardScore > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: rewardScore, gameName: 'Speed Tap' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    console.error("Score submission failed:", err);
                    syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Tap faster to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            timeLeft = 15.0;
            gameActive = false;
            scoreEl.innerText = score;
            timeLeftEl.innerText = timeLeft.toFixed(1);
            tapAreaText.innerText = "TAP!";
            gameOverScreen.style.display = 'none';
        }
    </script>
</body>
</html>
