<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Tower Blocks Light</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: #F4F7FC; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #0F172A; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #uiOverlay { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; padding: 12px 20px; border-radius: 16px; font-weight: 800; font-size: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); display: flex; align-items: center; gap: 8px; color: #0F172A; }
        #scoreBoard { color: #8B5CF6; border-left: 4px solid #8B5CF6; }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(244, 247, 252, 0.95); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2rem, 8vw, 3.5rem); color: #EF4444; margin-bottom: 8px; font-weight: 900; }
        #gameOverScreen p { font-size: 1.1rem; color: #64748B; margin-bottom: 12px; font-weight: 600; }
        #gameOverScreen span { color: #F59E0B; font-weight: 900; }
        #syncStatus { font-size: 1rem; color: #10B981; margin-bottom: 24px; font-weight: 700; }
        button { padding: 14px 32px; font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); color: #FFFFFF; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3); transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🏢 BLOCKS: <span id="score">0</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Tower Collapsed</h2>
            <p>Final tower height: <span><span id="finalScore">0</span> blocks</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let score = 0;
        let gameOver = false;
        
        let blocks = [];
        let blockHeight = 40;
        let currentBlock = {};
        let blockSpeed = 3;
        let blockDirection = 1;
        let baseWidth = 200;
        let viewOffset = 0;

        function playDropSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300 + (score % 12) * 40, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playCollapseSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (blocks.length === 0) {
                initGame();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        function initGame() {
            blocks = [{
                x: canvas.width / 2 - baseWidth / 2,
                y: canvas.height - 80,
                width: baseWidth,
                color: '#8B5CF6'
            }];
            spawnNewBlock();
        }

        function spawnNewBlock() {
            const previousBlock = blocks[blocks.length - 1];
            currentBlock = {
                x: blockDirection > 0 ? 0 : canvas.width - previousBlock.width,
                y: previousBlock.y - blockHeight,
                width: previousBlock.width,
                color: `hsl(${(blocks.length * 25) % 360}, 85%, 55%)`
            };
            blockSpeed = 3 + Math.min(blocks.length * 0.15, 6);
        }

        function dropBlock() {
            if (gameOver || !userId) return;

            const previousBlock = blocks[blocks.length - 1];
            const leftBound = previousBlock.x;
            const rightBound = previousBlock.x + previousBlock.width;

            if (currentBlock.x + currentBlock.width < leftBound || currentBlock.x > rightBound) {
                triggerGameOver();
                return;
            }

            let newX = Math.max(currentBlock.x, leftBound);
            let newWidth = Math.min(currentBlock.x + currentBlock.width, rightBound) - newX;

            currentBlock.x = newX;
            currentBlock.width = newWidth;
            blocks.push({...currentBlock});

            playDropSound();
            score++;
            scoreEl.innerText = score;

            const targetOffset = Math.max(0, (blocks.length - 6) * blockHeight);
            animateViewOffset(targetOffset);

            spawnNewBlock();
        }

        let offsetAnimId;
        function animateViewOffset(target) {
            cancelAnimationFrame(offsetAnimId);
            function step() {
                if (Math.abs(viewOffset - target) < 1) {
                    viewOffset = target;
                } else {
                    viewOffset += (target - viewOffset) * 0.1;
                    offsetAnimId = requestAnimationFrame(step);
                }
            }
            step();
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                dropBlock();
            }
        });

        function triggerGameOver() {
            gameOver = true;
            playCollapseSound();
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            if (score > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: score, gameName: 'Tower Blocks' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned} Coins added!`;
                        if (window.parent) { window.parent.postMessage({ type: 'GAME_SCORE', score: data.coinsEarned, game: 'Tower Blocks' }, '*'); }
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    syncStatusEl.innerText = "Failed to sync coins. Check connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Stack at least 1 block to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            gameOver = false;
            viewOffset = 0;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            initGame();
            animate();
        }

        function animate() {
            if (!userId || gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#F4F7FC';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, viewOffset);
            
            blocks.forEach((b) => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(0,0,0,0.1)';
                ctx.fillRect(b.x, b.y, b.width, blockHeight - 2);
            });

            ctx.fillStyle = currentBlock.color;
            ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight - 2);
            
            ctx.restore();
            ctx.shadowBlur = 0;

            currentBlock.x += blockSpeed * blockDirection;
            if (currentBlock.x + currentBlock.width > canvas.width || currentBlock.x < 0) {
                blockDirection *= -1;
            }

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        if (userId) {
            animate();
        }
    </script>
</body>
</html>
