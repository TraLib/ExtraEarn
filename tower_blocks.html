<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade - Tower Blocks</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%); font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; color: #fff; }
        #gameWrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #uiOverlay { position: absolute; top: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 14px 24px; border-radius: 16px; font-weight: 700; font-size: clamp(0.9rem, 3vw, 1.2rem); letter-spacing: 0.05em; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); display: flex; align-items: center; gap: 8px; }
        #scoreBoard { color: #38bdf8; border-bottom: 2px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }
        #gameOverScreen, #authScreen { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 20px; text-align: center; }
        #gameOverScreen { display: none; }
        #gameOverScreen h2 { font-size: clamp(2.5rem, 10vw, 4.5rem); color: #f87171; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 40px rgba(248, 113, 113, 0.6); }
        #gameOverScreen p { font-size: clamp(1.1rem, 4vw, 1.4rem); color: #9ca3af; margin-bottom: 12px; }
        #gameOverScreen span { color: #fbbf24; font-weight: 800; }
        #syncStatus { font-size: 1rem; color: #34d399; margin-bottom: 32px; font-weight: 600; text-shadow: 0 0 15px rgba(52, 211, 153, 0.3); }
        button { padding: 16px 40px; font-size: 1.1rem; font-weight: 700; background: #38bdf8; color: #030712; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.45); transition: all 0.2s ease-in-out; }
        button:hover { background: #0ea5e9; transform: translateY(-3px); box-shadow: 0 0 35px rgba(14, 165, 233, 0.75); }
        #authScreen h2 { font-size: clamp(2rem, 8vw, 3rem); color: #38bdf8; margin-bottom: 16px; }
        #authScreen p { color: #9ca3af; font-size: 1.1rem; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="uiOverlay">
            <div id="scoreBoard" class="glass-card">🏢 BLOCKS: <span id="score">0</span></div>
        </div>

        <div id="authScreen" style="display: none;">
            <h2>Unauthorized Access</h2>
            <p>Please launch the game directly from the ExtraEarn mobile application to earn coins.</p>
        </div>
        
        <div id="gameOverScreen">
            <h2>Tower Collapsed</h2>
            <p>Final tower height: <span><span id="finalScore">0</span> blocks</span></p>
            <div id="syncStatus">Syncing rewards...</div>
            <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const authScreen = document.getElementById('authScreen');
        const syncStatusEl = document.getElementById('syncStatus');
        const restartBtn = document.getElementById('restartBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            authScreen.style.display = 'flex';
        }

        let score = 0;
        let gameOver = false;
        
        // Stacker specific properties
        let blocks = [];
        let blockHeight = 40;
        let currentBlock = {};
        let blockSpeed = 3;
        let blockDirection = 1;
        let baseWidth = 200;
        let viewOffset = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (blocks.length === 0) {
                initGame();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        function initGame() {
            blocks = [{
                x: canvas.width / 2 - baseWidth / 2,
                y: canvas.height - 80,
                width: baseWidth,
                color: '#38bdf8'
            }];
            spawnNewBlock();
        }

        function spawnNewBlock() {
            const previousBlock = blocks[blocks.length - 1];
            currentBlock = {
                x: blockDirection > 0 ? 0 : canvas.width - previousBlock.width,
                y: previousBlock.y - blockHeight,
                width: previousBlock.width,
                color: `hsl(${(blocks.length * 20) % 360}, 80%, 60%)`
            };
            blockSpeed = 3 + Math.min(blocks.length * 0.15, 6);
        }

        function dropBlock() {
            if (gameOver || !userId) return;

            const previousBlock = blocks[blocks.length - 1];
            const leftBound = previousBlock.x;
            const rightBound = previousBlock.x + previousBlock.width;

            // Check overlap
            if (currentBlock.x + currentBlock.width < leftBound || currentBlock.x > rightBound) {
                // Completely missed
                triggerGameOver();
                return;
            }

            // Cut off the overhang
            let newX = Math.max(currentBlock.x, leftBound);
            let newWidth = Math.min(currentBlock.x + currentBlock.width, rightBound) - newX;

            currentBlock.x = newX;
            currentBlock.width = newWidth;
            blocks.push({...currentBlock});

            score++;
            scoreEl.innerText = score;

            // Camera shift down if tower gets high
            const targetOffset = Math.max(0, (blocks.length - 6) * blockHeight);
            animateViewOffset(targetOffset);

            spawnNewBlock();
        }

        let offsetAnimId;
        function animateViewOffset(target) {
            cancelAnimationFrame(offsetAnimId);
            function step() {
                if (Math.abs(viewOffset - target) < 1) {
                    viewOffset = target;
                } else {
                    viewOffset += (target - viewOffset) * 0.1;
                    offsetAnimId = requestAnimationFrame(step);
                }
            }
            step();
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                dropBlock();
            }
        });

        function triggerGameOver() {
            gameOver = true;
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
            syncStatusEl.innerText = "Syncing reward coins...";
            restartBtn.style.display = "none";

            if (score > 0) {
                fetch('/api/games/submit-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: score, gameName: 'Tower Blocks' })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        syncStatusEl.innerText = `Reward claimed! +${data.coinsEarned}
if (window.parent) { window.parent.postMessage({ type: 'SCORE_SUBMITTED', score: (data || res).coinsEarned }, '*'); } Coins added to your account!`;
                    } else {
                        syncStatusEl.innerText = `Sync status: ${data.error || "Claim failed"}`;
                    }
                    restartBtn.style.display = "block";
                })
                .catch(err => {
                    console.error("Score submission failed:", err);
                    syncStatusEl.innerText = "Failed to sync coins. Check internet connection.";
                    restartBtn.style.display = "block";
                });
            } else {
                syncStatusEl.innerText = "Stack at least 1 block to earn coins!";
                restartBtn.style.display = "block";
            }
        }

        function resetGame() {
            score = 0;
            gameOver = false;
            viewOffset = 0;
            scoreEl.innerText = score;
            gameOverScreen.style.display = 'none';
            initGame();
            animate();
        }

        function animate() {
            if (!userId || gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw stacked blocks
            ctx.save();
            ctx.translate(0, viewOffset);
            
            blocks.forEach((b) => {
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                ctx.fillRect(b.x, b.y, b.width, blockHeight - 2);
            });

            // Draw current flying block
            ctx.fillStyle = currentBlock.color;
            ctx.shadowColor = currentBlock.color;
            ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight - 2);
            
            ctx.restore();
            ctx.shadowBlur = 0;

            // Move block
            currentBlock.x += blockSpeed * blockDirection;
            if (currentBlock.x + currentBlock.width > canvas.width || currentBlock.x < 0) {
                blockDirection *= -1;
            }

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        if (userId) {
            animate();
        }
    </script>
</body>
</html>
